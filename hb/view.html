<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Akun HB - REKBER HB</title>
  <meta name="description" content="Detail akun berbahaya (HB) tercatat di database REKBER HB.">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('jsn-theme') || 'dark';
  </script>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/header.js" defer></script>
  <script src="components/footer.js" defer></script>
  <script src="components/theme.js" defer></script>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Detail Akun HB - REKBER HB">
  <meta property="og:description" content="Detail akun berbahaya (HB) tercatat di database REKBER HB.">
</head>

<body class="hb-view">
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="header-placeholder"></div>

  <main class="hb-view-content">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="particles" id="particles"></div>

    <section class="hb-view-shell">
      <div class="hb-header">
        <div>
          <span class="hb-status"><span class="dot"></span> ID HB VALID DITEMUKAN</span>
          <h1 id="hbTitle">Memuat data...</h1>
        </div>
        <span class="hb-date" id="hbDate">-</span>
      </div>

      <div class="hb-report">
        <p id="hbSubtitle">Memeriksa data laporan akun berbahaya...</p>
      </div>

      <div class="hb-detail-card" id="hbDetailCard">
        <div class="hb-detail-row"><span>Status</span><strong>Memuat data...</strong></div>
      </div>

      <div class="hb-correction" id="hbCorrection" style="display:none">
        <p>⚠️ Ada koreksi data? <a href="lapor.html">Laporkan</a> atau hubungi admin.</p>
      </div>

      <div class="hb-share" id="hbShare" style="display:none">
        <span>Bagikan:</span>
        <div class="hb-share-buttons">
          <a id="shareWa" href="#" target="_blank" rel="noopener">💬 WhatsApp</a>
          <a id="shareFb" href="#" target="_blank" rel="noopener">📘 Facebook</a>
          <a id="shareCopy" href="#" onclick="event.preventDefault();navigator.clipboard.writeText(location.href);alert('Link disalin!')">🔗 Copy Link</a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/script.js"></script>
  <script src="assets/js/hb-data.js"></script>
</body>
</html>
