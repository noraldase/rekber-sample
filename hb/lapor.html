<body class="search-page report-page">
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>
  <!-- NAVBAR (loaded from components/header.html) -->
  <div id="header-placeholder"></div>
  <main class="hb-report-page">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="particles" id="particles"></div>
    <section class="report-shell">
      <div class="report-intro">
        <div class="hb-status"><span class="dot"></span> FORM LAPORAN HB</div>
        <h1>Lapor Akun Berbahaya</h1>
        <p>Isi data pelaku dengan lengkap. Setelah laporan dikirim, code laporan akan muncul untuk dikirim ke admin
          bersama bukti transaksi.</p>
      </div>
      <form class="report-form" data-report-form>
        <label class="report-upload"><span>Masukan Foto Profile ML</span><input type="file" name="profilePhoto"
            accept="image/*" data-photo-input required><img data-photo-preview alt="Preview foto profil ML"><small
            data-photo-name></small></label>
        <div class="report-grid">
          <label>ID<input type="text" name="gameId" inputmode="numeric" pattern="[0-9]+"
              placeholder="Contoh: 1308534187" required></label>
          <label>Server<input type="text" name="serverId" inputmode="numeric" pattern="[0-9]+"
              placeholder="Contoh: 15334" required></label>
          <label>Tanggal transaksi<input type="date" name="transactionDate" required></label>
          <label>Tanggal ke HB<input type="date" name="hbDate" required></label>
          <label>Nama Lengkap/Nama fb pelaku<input type="text" name="offenderName" placeholder="Nama pelaku"
              required></label>
          <label>WhatsApp Pelaku<input type="tel" name="offenderWa" pattern="08[0-9\\- ]{7,}" placeholder="08xxxxxxxxxx"
              required></label>
          <label><span class="input-icon fb-icon"><svg viewBox="0 0 24 24">
                <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v2H6v4h3v5h4v-5h3l1-4h-4V9c0-.7.3-1 1-1z" />
              </svg></span> Nama FB Pelapor<input type="text" name="reporterFb" placeholder="Nama Facebook pelapor"
              required></label>
          <label><span class="input-icon wa-icon"><svg viewBox="0 0 24 24">
                <path
                  d="M12 3a8.8 8.8 0 0 0-7.5 13.4L3.7 21l4.7-1.2A8.9 8.9 0 1 0 12 3zm0 2a6.9 6.9 0 0 1 0 13.8c-1.2 0-2.4-.3-3.4-.9l-.4-.2-1.8.5.5-1.8-.3-.4A6.9 6.9 0 0 1 12 5zm-2.3 3.4c-.2 0-.5 0-.7.3-.2.3-.8.8-.8 2s.8 2.3 1 2.5c.1.2 1.6 2.6 4 3.5 2 .8 2.4.5 2.8.5.4 0 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.5-.3l-1.7-.8c-.2-.1-.4-.1-.6.1l-.7.9c-.1.2-.3.2-.5.1-1.3-.5-2.2-1.2-2.9-2.5-.1-.2 0-.4.1-.5l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5L11 8.9c-.2-.4-.4-.5-.7-.5h-.6z" />
              </svg></span> Nomor WA Pelapor<input type="tel" name="reporterWa" pattern="08[0-9\\- ]{7,}"
              placeholder="08xxxxxxxxxx" required></label>
        </div>
        <button type="submit" class="report-submit">Kirim Laporan</button>
      </form>
      <section class="pending-box" data-pending-box></section>
    </section>
