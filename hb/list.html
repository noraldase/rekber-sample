<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun HB — REKBER HB</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('rekber-theme')||'dark';</script>
  <style>
    .list-shell{max-width:720px;margin:0 auto;padding:60px 24px}
    .list-head{text-align:center;margin-bottom:32px}
    .list-head h1{font-size:30px;font-weight:800;margin-bottom:6px}
    .list-head p{color:var(--muted);font-size:15px}
    .list-head .count{margin-top:10px;display:inline-block;background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.3);color:var(--red);font-weight:700;font-size:13px;padding:5px 14px;border-radius:100px}
    .hb-card{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;align-items:center;transition:border .2s,transform .2s}
    .hb-card:hover{border-color:rgba(255,71,87,.4);transform:translateY(-2px)}
    .hb-card img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
    .hb-card .info{flex:1;min-width:0}
    .hb-card .info strong{display:block;font-size:16px;margin-bottom:2px}
    .hb-card .info span{font-size:13px;color:var(--muted)}
    .hb-card .badge{font-size:11px;font-weight:800;color:var(--red);background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.3);padding:4px 10px;border-radius:100px;flex:none}
    .pagination{display:flex;gap:8px;justify-content:center;margin-top:28px;flex-wrap:wrap}
    .pagination button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;transition:all .2s}
    .pagination button:hover{border-color:var(--blue);color:var(--blue)}
    .pagination button.active{background:linear-gradient(135deg,#2d7aff,#5b9aff);color:#fff;border-color:transparent}
    .loading{text-align:center;color:var(--muted);padding:40px}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><div class="logo-mark">R</div><div>REKBER HB<small>Database Akun Berbahaya</small></div></a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Cek ID</a>
        <a href="search.html">Cari</a>
        <a href="lapor.html">Lapor</a>
        <a href="list.html" class="active">Daftar HB</a>
      </div>
      <div class="nav-cta">
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      </div>
    </div>
  </nav>

  <main class="list-shell">
    <div class="list-head">
      <h1>Daftar Akun Berbahaya</h1>
      <p>Akun yang sudah diverifikasi & di-approve admin</p>
      <div class="count" id="countLabel">0 akun</div>
    </div>
    <div id="hbList"><div class="loading"><span class="dot"></span> Memuat data...</div></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <script src="assets/js/config.js"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('rekber-theme') || 'dark';
    themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
    themeToggle.onclick = () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      localStorage.setItem('rekber-theme', t);
      themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    };

    const list = document.getElementById('hbList');
    const pagination = document.getElementById('pagination');
    const perPage = 10;
    let currentPage = 1;

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function render(page) {
      currentPage = page;
      list.innerHTML = '<div class="loading"><span class="dot"></span> Memuat data...</div>';
      try {
        const res = await fetch(`${window.API_BASE}/api/hb/list?page=${page}&limit=${perPage}`);
        const json = await res.json();
        if (!json.ok) { list.innerHTML = '<div class="loading">Gagal memuat data</div>'; return; }

        document.getElementById('countLabel').textContent = `${json.total} akun`;

        if (!json.data.length) {
          list.innerHTML = '<div class="loading">Belum ada data akun HB.</div>';
        } else {
          list.innerHTML = json.data.map(r => `
            <a class="hb-card" href="view.html?id=${encodeURIComponent(r.id_game)}">
              ${r.image_path ? `<img src="${window.API_BASE}/uploads/${r.image_path}" alt="">` : ''}
              <div class="info">
                <strong>${escapeHtml(r.id_game)} (${escapeHtml(r.server)})</strong>
                <span>HB ${r.hb_date || '-'} • ${escapeHtml(r.offender_name)}</span>
              </div>
              <span class="badge">⚠ HB</span>
            </a>
          `).join('');
        }

        pagination.innerHTML = '';
        if (json.total_pages > 1) {
          for (let i = 1; i <= json.total_pages; i++) {
            pagination.innerHTML += `<button class="${i===currentPage?'active':''}" onclick="render(${i})">${i}</button>`;
          }
        }
      } catch (err) {
        list.innerHTML = `<div class="loading">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    render(1);
  </script>
</body>
</html>
